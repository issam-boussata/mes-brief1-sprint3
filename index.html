<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Voyages – Explorer le monde</title>
    <!-- cdn tailwind css -->
      <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <!-- Police Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Si tu utilises un framework CSS (Bootstrap, Tailwind…), ajoute son lien ICI, AVANT style.css -->
    <link rel="stylesheet" href="style.css" />

    <!-- defer : le script s'exécute une fois le HTML chargé -->
    <script src="script.js" defer></script>
  </head>
  <body class="bg-[#f5f7fa]">
    <header class="bg-[#0f4c81] py-6">
      <span class="text-[#FFFFFF] font-bold text-[30px] mx-6 ">Atlas Voyages</span>
    </header>
    <main class="px-6 space-y-10">
      <section class="my-4">
        <h1 class=" font-bold text-[40px]">Explorer le monde</h1>
        <p class="text-[#5B6576] text-[25px]">Choisis un continent, parcours les pays et trouve ta prochaine destination.</p>
      </section>
      <section>
        <form class="bg-[#ffffff] grid grid-cols-1 space-y-4 p-4 md:grid-cols-2 md:gap-5 lg:grid-cols-5 lg:gap-6  lg:items-center" >
          <div class="col-span-1">
            <label for="Continent" class="font-semibold text-lg">Continent</label> <br>
            <select name="Continent" id="Continent" class="w-[100%] rounded-md ">
              <option value="">tous</option>
              <option value="Americas">Americas</option>
              <option value="Africa">Africa</option>
              <option value="Europe">Europe</option>
              <option value="Asia">Asia</option>
            </select>
          </div>
          <div class="col-span-2">
            <label for="pay" class="font-semibold text-lg">Rechercher un pays</label> <br>
            <input type="text" name="pay" id="pay" class="w-[100%] rounded-md" placeholder="Ex. : Morocco">
          </div>
          <button type="button" class="p-4 bg-[#0f4c81] font-semibold text-lg text-[#ffffff] rounded-md h-fit">Trier par population</button>
        </form>
      </section>
      <section id="cartes" class="space-y-6  my-6 col-span-1">

      </section>
    </main>

  </body>
</html>
